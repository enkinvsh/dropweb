name: windows-clean-install

on:
  workflow_dispatch: {}
  push:
    branches: [dev]
    paths:
      - '.github/workflows/windows-clean-install.yaml'
      - '.github/scripts/windows_obkatka.ps1'
      - '.github/scripts/win_conflict_inspect.ps1'
      - 'windows/packaging/exe/inno_setup.iss'
      - 'windows/**'
      - 'lib/main.dart'
      - 'lib/application.dart'
      - 'lib/controller.dart'
      - 'lib/state.dart'
      - 'lib/clash/**'
      - 'lib/services/**'
      - 'lib/manager/**'
      - 'lib/common/windows.dart'
      - 'lib/common/windows_conflict.dart'
      - 'core/**'
      - 'plugins/**'
      - 'services/helper/**'
      - 'setup.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'

permissions:
  contents: read

jobs:
  build-installer:
    name: Build Windows amd64 installer from source
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"
          cache-dependency-path: |
            core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
          flutter-version: 3.41.6

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build candidate installer
        run: dart setup.dart windows --arch amd64

      - name: Verify installer artifact
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem dist -Filter '*.exe' -Recurse | Where-Object { $_.Name -match 'setup|amd64' })
          if ($installers.Count -ne 1) {
            Write-Host "::error::expected exactly one installer, found $($installers.Count)"
            Get-ChildItem dist -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          Write-Host "installer: $($installers[0].FullName)"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: dropweb-windows-installer
          path: dist/*.exe
          if-no-files-found: error
          overwrite: true

  clean-install:
    name: Strict untouched clean-first-start gate
    runs-on: windows-2025
    needs: build-installer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download candidate installer
        uses: actions/download-artifact@v4
        with:
          name: dropweb-windows-installer
          path: dl/dropweb

      - name: Run strict clean-first-start scenario
        id: scenario
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . ./.github/scripts/windows_obkatka.ps1
          Initialize-ObkatkaEvidence -Reset | Out-Null
          $checks = [System.Collections.Generic.List[object]]::new()
          $clock = [System.Diagnostics.Stopwatch]::StartNew()
          $installSeconds = 0
          $settleSeconds = 0
          $result = 'FAIL'
          $firstFailure = $null

          function Add-GateCheck {
            param([string]$Name, [bool]$Passed, [string]$Detail)
            $status = if ($Passed) { 'PASS' } else { 'FAIL' }
            $checks.Add((New-ObkatkaCheck -Name $Name -Status $status -Detail $Detail))
            if (-not $Passed) { throw "$Name`: $Detail" }
          }

          try {
            Export-ObkatkaSnapshot -Label 'clean baseline'
            & pwsh -NoProfile -File ./.github/scripts/win_conflict_inspect.ps1 -Label 'clean baseline' *>&1 |
              Tee-Object -FilePath (Join-Path (Get-ObkatkaEvidenceRoot) 'inspector.txt')

            $existingData = @(
              Get-ChildItem $env:APPDATA -Directory -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -match 'dropweb' }
            )
            $existingDataDetail = if ($existingData.Count -eq 0) { 'none' } else { ($existingData | ForEach-Object { $_.FullName }) -join ', ' }
            Add-GateCheck 'baseline-app-data-absent' ($existingData.Count -eq 0) $existingDataDetail
            Add-GateCheck 'baseline-service-absent' (-not (Get-Service DropwebHelperService -ErrorAction SilentlyContinue)) 'DropwebHelperService must not pre-exist'
            Add-GateCheck 'baseline-process-absent' (-not (Get-Process dropweb -ErrorAction SilentlyContinue)) 'dropweb.exe must not pre-exist'
            Add-GateCheck 'baseline-port-47896-free' ((Get-ObkatkaListenerPids -Port 47896).Count -eq 0) 'port 47896 must not have a listener'
            Add-GateCheck 'baseline-install-entry-absent' (-not (Get-ObkatkaUninstallEntry -NamePattern '(?i)^dropweb')) 'dropweb uninstall entry must not pre-exist'
            Add-GateCheck 'baseline-flclashx-absent' (-not (Get-ObkatkaUninstallEntry -NamePattern '(?i)FlClashX')) 'clean scenario excludes FlClashX'

            $installers = @(Get-ChildItem dl/dropweb -Filter '*.exe' -Recurse)
            Add-GateCheck 'candidate-installer-count' ($installers.Count -eq 1) "count=$($installers.Count)"
            $installer = $installers[0]
            $installerHash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            @("path=$($installer.FullName)", "sha256=$installerHash") |
              Set-Content (Join-Path (Get-ObkatkaEvidenceRoot) 'installer.txt') -Encoding utf8
            $checks.Add((New-ObkatkaCheck -Name 'candidate-installer-sha256' -Status 'PASS' -Detail $installerHash))
            $checks.Add((New-ObkatkaCheck -Name 'runner-image' -Status 'PASS' -Detail "$env:ImageOS/$env:ImageVersion; $([Environment]::OSVersion.VersionString)"))

            $installClock = [System.Diagnostics.Stopwatch]::StartNew()
            $installerProcess = Start-Process -FilePath $installer.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NORESTARTAPPLICATIONS','/NOICONS','/NOCANCEL' -Wait -PassThru
            $installClock.Stop()
            $installSeconds = [math]::Round($installClock.Elapsed.TotalSeconds, 1)
            Add-GateCheck 'installer-exit' ($installerProcess.ExitCode -eq 0) "exit=$($installerProcess.ExitCode)"

            $entry = Get-ObkatkaUninstallEntry -NamePattern '(?i)^dropweb'
            Add-GateCheck 'install-entry' ($null -ne $entry) 'dropweb uninstall entry exists'
            $installLocation = [string]$entry.InstallLocation
            if (-not $installLocation) { $installLocation = 'C:\Program Files\dropweb' }
            $installLocation = $installLocation.TrimEnd('\')
            Add-GateCheck 'install-folder-decoupled' ($installLocation -notmatch '(?i)FlClashX') $installLocation

            $installedFiles = [ordered]@{
              app = Join-Path $installLocation 'dropweb.exe'
              core = Join-Path $installLocation 'DropwebCore.exe'
              helper = Join-Path $installLocation 'DropwebHelperService.exe'
            }
            foreach ($item in $installedFiles.GetEnumerator()) {
              Add-GateCheck "installed-$($item.Key)" (Test-Path $item.Value) $item.Value
              $hash = (Get-FileHash $item.Value -Algorithm SHA256).Hash.ToLowerInvariant()
              $checks.Add((New-ObkatkaCheck -Name "$($item.Key)-sha256" -Status 'PASS' -Detail $hash))
            }

            $service = Get-Service DropwebHelperService -ErrorAction SilentlyContinue
            if ($service) {
              for ($attempt = 0; $attempt -lt 6 -and $service.Status -ne 'Running'; $attempt++) {
                Start-Sleep -Seconds 2
                $service.Refresh()
              }
            }
            $serviceStatus = if ($service) { $service.Status } else { 'ABSENT' }
            Add-GateCheck 'helper-service-running' ($service -and $service.Status -eq 'Running') "status=$serviceStatus"

            $identity = Test-ObkatkaHelperIdentity -CorePath $installedFiles.core -ServiceName 'DropwebHelperService' -Port 47896
            $serviceExe = Get-ObkatkaServiceExecutablePath $identity.service.PathName
            Add-GateCheck 'helper-service-path' ([string]::Equals($serviceExe, $installedFiles.helper, [StringComparison]::OrdinalIgnoreCase)) $serviceExe
            Add-GateCheck 'helper-ping-core-token' $identity.pingMatches "ping=$($identity.pingBody) core=$($identity.coreHash)"
            Add-GateCheck 'helper-service-pid-owns-47896' $identity.pidOwnsPort "servicePid=$($identity.servicePid) listenerPids=$($identity.listenerPids -join ',')"

            Start-Process -FilePath $installedFiles.app | Out-Null
            $settleClock = [System.Diagnostics.Stopwatch]::StartNew()
            Start-Sleep -Seconds 25
            $settleClock.Stop()
            $settleSeconds = [math]::Round($settleClock.Elapsed.TotalSeconds, 1)
            Save-ObkatkaScreenshot -Name 'clean-first-start-after-25s' | Out-Null

            $running = @(Get-Process dropweb -ErrorAction SilentlyContinue)
            $runningPids = if ($running.Count -gt 0) { ($running | ForEach-Object { $_.Id }) -join ',' } else { 'none' }
            Add-GateCheck 'app-alive-after-25s' ($running.Count -gt 0) "pids=$runningPids"
            $log = Find-ObkatkaAppLog
            $logPath = if ($log) { $log.FullName } else { 'ABSENT' }
            Add-GateCheck 'app-log-produced' ($null -ne $log) "path=$logPath"
            Get-Content $log.FullName -Tail 150 | ForEach-Object { Write-Host $_ }

            foreach ($bootCheck in @(Test-ObkatkaBootLog -LogPath $log.FullName -RequireHelperSpawn)) {
              $checks.Add($bootCheck)
            }
            $failedBoot = @($checks | Where-Object { $_.status -eq 'FAIL' })
            if ($failedBoot.Count -gt 0) { throw "$($failedBoot[0].name): $($failedBoot[0].detail)" }

            $dropwebProtocol = Get-ObkatkaProtocolHandler -Scheme 'dropweb'
            $dropwebProtocolCommand = if ($dropwebProtocol) { $dropwebProtocol.command } else { 'ABSENT' }
            Add-GateCheck 'dropweb-protocol-owned' ($dropwebProtocol -and $dropwebProtocol.command -match [regex]::Escape($installedFiles.app)) "command=$dropwebProtocolCommand"
            $result = 'PASS'
          } catch {
            Write-Host "::error::$($_.Exception.Message)"
            if (@($checks | Where-Object { $_.status -eq 'FAIL' }).Count -eq 0) {
              $checks.Add((New-ObkatkaCheck -Name 'scenario-exception' -Status 'FAIL' -Detail $_.Exception.Message))
            }
          } finally {
            try { Export-ObkatkaSnapshot -Label 'clean final' } catch { Write-Host "::warning::final snapshot failed: $_" }
            if (-not (Test-Path (Join-Path (Get-ObkatkaEvidenceRoot) 'clean-first-start-after-25s.png'))) {
              Save-ObkatkaScreenshot -Name 'clean-first-start-final' | Out-Null
            }
            $clock.Stop()
            $first = @($checks | Where-Object { $_.status -eq 'FAIL' } | Select-Object -First 1)
            if ($first.Count -gt 0) { $firstFailure = $first[0].name; $result = 'FAIL' }
            $durations = [pscustomobject][ordered]@{
              installSeconds = $installSeconds
              settleSeconds = $settleSeconds
              totalSeconds = [math]::Round($clock.Elapsed.TotalSeconds, 1)
            }
            Write-ObkatkaVerdict -Scenario 'clean-first-start' -Result $result -Checks @($checks) -FirstFailure $firstFailure -Durations $durations
          }

          if ($result -ne 'PASS') { exit 1 }

      - name: Upload verdict, evidence, and app logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-first-start-evidence
          path: ci-evidence/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  wintun-qualify:
    name: Informational Wintun 0.14.1 capability spike
    runs-on: windows-2025
    continue-on-error: true
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4

      - name: Create and clean up a Wintun adapter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . ./.github/scripts/windows_obkatka.ps1
          Initialize-ObkatkaEvidence -Reset | Out-Null
          $checks = [System.Collections.Generic.List[object]]::new()
          $clock = [System.Diagnostics.Stopwatch]::StartNew()
          $result = 'FAIL'
          $handle = [IntPtr]::Zero

          function Add-QualifyCheck {
            param([string]$Name, [bool]$Passed, [string]$Detail)
            $status = if ($Passed) { 'PASS' } else { 'FAIL' }
            $checks.Add((New-ObkatkaCheck -Name $Name -Status $status -Detail $Detail))
            if (-not $Passed) { throw "$Name`: $Detail" }
          }

          try {
            Export-ObkatkaSnapshot -Label 'wintun baseline'
            $checks.Add((New-ObkatkaCheck -Name 'runner-image' -Status 'PASS' -Detail "$env:ImageOS/$env:ImageVersion; $([Environment]::OSVersion.VersionString)"))
            Get-NetAdapter | Select-Object Name, InterfaceDescription, Status, ifIndex, MacAddress |
              ConvertTo-Json -Depth 4 | Set-Content (Join-Path (Get-ObkatkaEvidenceRoot) 'network-before.json') -Encoding utf8
            $zip = Join-Path $env:RUNNER_TEMP 'wintun-0.14.1.zip'
            $extract = Join-Path $env:RUNNER_TEMP 'wintun-0.14.1'
            Invoke-WebRequest -Uri 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $zip
            $actualHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
            $expectedHash = '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51'
            Add-QualifyCheck 'wintun-zip-sha256' ($actualHash -ceq $expectedHash) "actual=$actualHash expected=$expectedHash"

            Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
            $dll = Join-Path $extract 'wintun/bin/amd64/wintun.dll'
            Add-QualifyCheck 'wintun-archive-amd64-dll' (Test-Path $dll) $dll
            Copy-Item -LiteralPath $dll -Destination (Join-Path $env:WINDIR 'System32/wintun.dll') -Force

            Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;

          public static class WintunNative {
              [DllImport("wintun.dll", SetLastError = true, CharSet = CharSet.Unicode)]
              public static extern IntPtr WintunCreateAdapter(
                  [MarshalAs(UnmanagedType.LPWStr)] string name,
                  [MarshalAs(UnmanagedType.LPWStr)] string tunnelType,
                  IntPtr requestedGuid);

              [DllImport("wintun.dll")]
              public static extern void WintunCloseAdapter(IntPtr adapter);
          }
          '@
            $handle = [WintunNative]::WintunCreateAdapter('dropweb-ci', 'ci-probe', [IntPtr]::Zero)
            if ($handle -eq [IntPtr]::Zero) {
              $nativeError = [Runtime.InteropServices.Marshal]::GetLastWin32Error()
              throw "WintunCreateAdapter returned NULL; win32=$nativeError"
            }

            $adapter = $null
            for ($attempt = 0; $attempt -lt 10 -and -not $adapter; $attempt++) {
              Start-Sleep -Seconds 1
              $adapter = Get-NetAdapter -Name 'dropweb-ci' -ErrorAction SilentlyContinue
            }
            $adapterDetail = if ($adapter) { "adapter=$($adapter.Name) status=$($adapter.Status) ifIndex=$($adapter.ifIndex)" } else { 'adapter not visible in Get-NetAdapter' }
            Add-QualifyCheck 'tun_capability' ($null -ne $adapter) $adapterDetail
            Get-NetAdapter | Select-Object Name, InterfaceDescription, Status, ifIndex, MacAddress |
              ConvertTo-Json -Depth 4 | Set-Content (Join-Path (Get-ObkatkaEvidenceRoot) 'network-up.json') -Encoding utf8
            Export-ObkatkaSnapshot -Label 'wintun adapter up'
          } catch {
            Write-Host "::error::$($_.Exception.Message)"
            if (@($checks | Where-Object { $_.status -eq 'FAIL' }).Count -eq 0) {
              $checks.Add((New-ObkatkaCheck -Name 'tun_capability' -Status 'FAIL' -Detail $_.Exception.Message))
            }
          } finally {
            if ($handle -ne [IntPtr]::Zero) {
              [WintunNative]::WintunCloseAdapter($handle)
              $handle = [IntPtr]::Zero
            }
            Start-Sleep -Seconds 3
            $remaining = Get-NetAdapter -Name 'dropweb-ci' -ErrorAction SilentlyContinue
            $cleanupPassed = $null -eq $remaining
            $checks.Add((New-ObkatkaCheck -Name 'wintun-adapter-cleanup' -Status $(if ($cleanupPassed) { 'PASS' } else { 'FAIL' }) -Detail $(if ($cleanupPassed) { 'adapter removed' } else { "adapter remains: $($remaining.Status)" })))
            Get-NetAdapter | Select-Object Name, InterfaceDescription, Status, ifIndex, MacAddress |
              ConvertTo-Json -Depth 4 | Set-Content (Join-Path (Get-ObkatkaEvidenceRoot) 'network-after.json') -Encoding utf8
            try { Export-ObkatkaSnapshot -Label 'wintun final' } catch { Write-Host "::warning::final snapshot failed: $_" }
            Save-ObkatkaScreenshot -Name 'wintun-qualification' | Out-Null
            $clock.Stop()
            $failed = @($checks | Where-Object { $_.status -eq 'FAIL' })
            if ($failed.Count -eq 0) { $result = 'PASS' }
            $firstFailure = if ($failed.Count -gt 0) { $failed[0].name } else { $null }
            $durations = [pscustomobject][ordered]@{ totalSeconds = [math]::Round($clock.Elapsed.TotalSeconds, 1) }
            Write-ObkatkaVerdict -Scenario 'wintun-qualify' -Result $result -Checks @($checks) -FirstFailure $firstFailure -Durations $durations
          }

          if ($result -ne 'PASS') { exit 1 }

      - name: Upload Wintun qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wintun-qualification-evidence
          path: ci-evidence/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
